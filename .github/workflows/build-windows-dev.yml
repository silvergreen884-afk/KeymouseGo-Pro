name: Build Windows Dev

on:
  push:
    branches:
      - dev
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt
          pip install pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller -Fw --icon=Mondrian.ico --add-data "./assets;assets" KeymouseGo.py

      - name: Rename EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item "dist\KeymouseGo.exe" "artifact\KeymouseGo-Pro-dev.exe"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: KeymouseGo-Pro-Windows-${{ github.run_number }}
          path: artifact/KeymouseGo-Pro-dev.exe
          retention-days: 14